security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            # No "property": UserRepository::loadUserByIdentifier does a case-insensitive lookup.
            entity:
                class: App\Entity\User

    firewalls:
        main:
            lazy: true
            provider: app_users
            entry_point: App\Security\JsonAuthenticationResponder
            json_login:
                check_path: api_auth_login
                username_path: username
                password_path: password
                failure_handler: App\Security\JsonAuthenticationResponder
            logout:
                path: api_auth_logout
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    # Only the *first* matching rule is applied.
    access_control:
        - { path: ^/api/auth/(register|login)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/, roles: ROLE_USER }
        - { path: ^/api/scores/top$, roles: PUBLIC_ACCESS }
        - { path: ^/api/scores, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
